name: Scene direction tests
on:
  push:
    branches: ['feature/confirmed-scene-direction']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/scene-direction.test.mjs
